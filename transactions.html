<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f8f6">
<title>Log4Money · Transaksi</title><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app-shell"><aside class="sidebar" id="side"></aside><div class="content"><header class="topbar" id="top"></header>
